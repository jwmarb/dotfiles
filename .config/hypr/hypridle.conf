# hypridle config (Hyprland 0.57+: dispatches use the Lua hl.dsp syntax)
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Desktop with external monitors: no backlight, so no brightnessctl listeners.

general {
    lock_cmd = pidof hyprlock || hyprlock                             # avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # turn screens back on after resume
}

listener {
    timeout = 300                                                     # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                                     # 5.5 min: screens off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# No auto-suspend: the PC stays awake however long it's idle (screens still turn off above).
