# vim:fileencoding=utf-8:foldmethod=marker

# BEGIN_KITTY_THEME
# Everforest Dark Hard
include current-theme.conf
# END_KITTY_THEME

# BEGIN_KITTY_FONTS
font_family      family="FiraCode Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
window_padding_width 5
tab_bar_style slant
enable_audio_bell yes
# Quieter bell: kitty has no volume knob, so bell_path points at a
# pre-attenuated copy of freedesktop's bell.oga.
# volume=0.3 is ~-10 dB, which is roughly *perceived* half loudness
# (halving amplitude is only -6 dB and barely sounds quieter).
# Regenerate / adjust with:
#   ffmpeg -y -i /usr/share/sounds/freedesktop/stereo/bell.oga \
#     -filter:a volume=0.3 -c:a libvorbis -f ogg ~/.config/kitty/bell-quiet.oga
# Path is relative to the kitty config dir, so this stays portable.
bell_path bell-quiet.oga
notify_on_cmd_finish unfocused